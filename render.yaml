services:
  - type: web
    name: production-optimizer-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/build_dataset.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    initialDeployHook: python -m app.create_db && python reset_and_import.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: production-optimizer-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: production-optimizer-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: production-optimizer-db
    databaseName: production_optimizer
    user: production_optimizer
